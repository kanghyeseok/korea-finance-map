<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>전국 재정자립도 지도 — 모바일</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1a1410" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<style>
  :root {
    --paper:        #f4efe6;
    --paper-deep:   #ebe3d4;
    --ink:          #1a1410;
    --ink-soft:     #4a3f33;
    --ink-faint:    #8a7d6c;
    --rule:         #c9bda8;
    --accent:       #b91c1c;
    --highlight:    #facc15;
    --safe-top:     env(safe-area-inset-top, 0px);
    --safe-bottom:  env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans KR', sans-serif;
    font-weight: 300; line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    touch-action: manipulation;
    overscroll-behavior: none;
  }

  .app {
    position: fixed; inset: 0;
    display: grid;
    grid-template-rows: auto 1fr auto;
    background: var(--paper);
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
  }

  /* ── Header ────────────────────────────────────────── */
  header.top {
    border-bottom: 2px solid var(--ink);
    padding: 10px 14px 8px;
    background: var(--paper);
  }
  header.top h1 {
    font-family: 'Nanum Myeongjo', serif;
    font-weight: 800;
    font-size: 18px;
    letter-spacing: -0.02em;
    line-height: 1.1;
    color: var(--ink);
  }
  header.top .sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-top: 4px;
  }
  header.top .sub .accent { color: var(--accent); font-weight: 600; }

  /* metric toggle */
  .metric-toggle {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    margin-top: 8px;
    border: 1px solid var(--ink);
    width: 100%;
  }
  .metric-toggle button {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: transparent;
    border: none;
    border-right: 1px solid var(--ink);
    color: var(--ink-soft);
    padding: 9px 4px;
    cursor: pointer;
    font-weight: 500;
  }
  .metric-toggle button:last-child { border-right: none; }
  .metric-toggle button.active { background: var(--ink); color: var(--paper); }

  /* ── Map ────────────────────────────────────────── */
  .map-wrap {
    position: relative;
    overflow: hidden;
    background: var(--paper);
    background-image: radial-gradient(circle at 1px 1px, rgba(26,20,16,0.05) 1px, transparent 0);
    background-size: 6px 6px;
  }
  #map-svg {
    width: 100%; height: 100%;
    display: block;
    touch-action: none;
  }
  #map-svg .region {
    stroke: var(--paper);
    stroke-width: 0.5px;
    transition: filter 100ms ease;
    cursor: pointer;
  }
  #map-svg .region.active {
    stroke: var(--ink);
    stroke-width: 1.6px;
    filter: brightness(1.08);
  }
  #map-svg .province-line {
    fill: none; stroke: var(--ink); stroke-width: 1px;
    opacity: 0.55; pointer-events: none;
  }
  #map-svg .province-label {
    font-family: 'Nanum Myeongjo', serif;
    font-weight: 700;
    font-size: 11px;
    fill: var(--ink); pointer-events: none;
    paint-order: stroke fill;
    stroke: var(--paper); stroke-width: 3px;
    stroke-linejoin: round;
    transition: opacity 200ms ease;
  }
  #map-svg .muni-label {
    font-family: 'IBM Plex Sans KR', sans-serif;
    font-weight: 500;
    fill: var(--ink); pointer-events: none;
    paint-order: stroke fill;
    stroke: var(--paper); stroke-width: 0.5px;
    stroke-linejoin: round;
    font-size: 3px;
    opacity: 0;
    transition: opacity 220ms ease;
  }
  #map-svg .muni-label.show { opacity: 1; }
  #map-svg .muni-label.high { fill: #fff; stroke: rgba(0,0,0,0.5); }

  .loading {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.18em;
    color: var(--ink-faint);
    text-transform: uppercase;
    padding: 1em;
  }

  /* Floating reset button */
  .reset-btn {
    position: absolute;
    top: 12px; right: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: var(--ink);
    color: var(--paper);
    border: 1px solid var(--ink);
    padding: 10px 14px;
    cursor: pointer;
    font-weight: 600;
    box-shadow: 2px 2px 0 var(--accent);
    opacity: 0;
    transform: translateY(-8px);
    pointer-events: none;
    transition: opacity 200ms ease, transform 200ms ease;
    z-index: 10;
  }
  .reset-btn.show {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  /* Hint banner */
  .hint {
    position: absolute;
    left: 12px; right: 12px;
    bottom: 12px;
    background: rgba(26,20,16,0.86);
    color: var(--paper);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 8px 12px;
    text-align: center;
    border: 1px solid var(--ink);
    pointer-events: none;
    transition: opacity 300ms ease;
    z-index: 5;
  }
  .hint.hide { opacity: 0; }
  .hint .acc { color: var(--highlight); font-weight: 600; }

  /* ── Legend bar (bottom) ────────────────────────────────── */
  .legend {
    border-top: 1px solid var(--ink);
    padding: 8px 14px 10px;
    background: var(--paper);
  }
  .legend-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--ink-soft);
    margin-bottom: 5px;
  }
  .legend-bar {
    display: flex; height: 12px;
    border: 1px solid var(--ink);
  }
  .legend-bar > span { flex: 1; }
  .legend-ticks {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-soft);
    display: flex;
    justify-content: space-between;
    margin-top: 4px;
    letter-spacing: 0.04em;
  }

  /* ── Bottom Sheet (touch detail) ────────────────────────────────── */
  .sheet-backdrop {
    position: fixed; inset: 0;
    background: rgba(26,20,16,0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 200ms ease;
    z-index: 20;
  }
  .sheet-backdrop.show { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--paper);
    border-top: 2px solid var(--ink);
    box-shadow: 0 -6px 0 rgba(26,20,16,0.08);
    padding: 14px 18px calc(20px + var(--safe-bottom));
    transform: translateY(110%);
    transition: transform 280ms cubic-bezier(.4,0,.2,1);
    z-index: 30;
    max-height: 70vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .sheet.show { transform: translateY(0); }

  .sheet-handle {
    width: 40px; height: 4px;
    background: var(--ink-faint);
    border-radius: 2px;
    margin: 0 auto 12px;
  }

  .sheet-close {
    position: absolute;
    top: 10px; right: 12px;
    width: 32px; height: 32px;
    background: transparent;
    border: 1px solid var(--ink);
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    font-weight: 600;
  }

  .sheet .ic-prov {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 4px;
    font-weight: 600;
  }
  .sheet .ic-name {
    font-family: 'Nanum Myeongjo', serif;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: -0.01em;
    color: var(--ink);
    line-height: 1.1;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--ink);
    padding-bottom: 8px;
    padding-right: 36px;
  }
  .sheet .ic-metrics {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
    margin-bottom: 12px;
  }
  .sheet .ic-cell {
    text-align: center;
    border: 1px solid var(--rule);
    padding: 8px 4px;
    background: var(--paper-deep);
  }
  .sheet .ic-cell .lbl {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    color: var(--ink-faint);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .sheet .ic-cell .val {
    font-family: 'Nanum Myeongjo', serif;
    font-weight: 800;
    font-size: 15px;
    color: var(--ink);
    line-height: 1.05;
    word-break: break-all;
  }
  .sheet .ic-cell .unit {
    font-family: 'IBM Plex Sans KR', sans-serif;
    font-size: 9px;
    font-weight: 400;
    color: var(--ink-soft);
    margin-left: 2px;
    white-space: nowrap;
  }
  .sheet .ic-extras {
    border-top: 1px dotted var(--rule);
    padding-top: 8px;
    display: grid;
    gap: 6px;
  }
  .sheet .ic-extras .row {
    display: flex; justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
  }
  .sheet .ic-extras .row strong {
    color: var(--ink);
    font-weight: 600;
  }
  .sheet .ic-extras .row.pos strong { color: #15803d; }
  .sheet .ic-extras .row.neg strong { color: var(--accent); }

  .sheet-action {
    margin-top: 14px;
    padding: 12px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    width: 100%;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    font-weight: 600;
  }
  .sheet-action.alt { background: var(--paper); color: var(--ink); border: 1px solid var(--ink); }

  /* Tablet/landscape adjustments */
  @media (min-width: 600px) {
    header.top h1 { font-size: 22px; }
    .metric-toggle button { font-size: 12px; padding: 11px 4px; }
    .sheet { max-width: 480px; left: 50%; transform: translate(-50%, 110%); border-left: 2px solid var(--ink); border-right: 2px solid var(--ink); border-radius: 0; }
    .sheet.show { transform: translate(-50%, 0); }
  }
</style>
</head>

<div class="app">
  <header class="top">
    <h1>전국 재정자립도 지도</h1>
    <div class="sub">
      <span class="accent">FY2025</span> · 17 광역 · 226 시·군·구 · 단위 %
    </div>
    <div class="metric-toggle" id="metric-toggle">
      <button data-metric="value" class="active">재정자립도</button>
      <button data-metric="budget">예산규모</button>
      <button data-metric="income">자체수입</button>
    </div>
  </header>

  <div class="map-wrap">

    <button class="reset-btn" id="reset-zoom">◧ 전국 보기</button>

  </div>

  <div class="legend">
    <div class="legend-title" id="legend-title">재정자립도 (%)</div>
    <div class="legend-bar" id="legend-bar"></div>
    <div class="legend-ticks" id="legend-ticks"></div>
  </div>
</div>

<div class="sheet-backdrop" id="sheet-backdrop"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <button class="sheet-close" id="sheet-close" aria-label="close">✕</button>
  <div id="sheet-body"></div>
</div>

/* ═════════════════════════════════════════════════════════════
   3. COLOR SCALE & LEGEND
   ───────────────────────────────────────────────────────────── */
function makeColorScale() {
  const vals = MUNIS.map(d => getVal(d));
  const sorted = vals.slice().sort((a,b) => a - b);
  const p95 = d3.quantile(sorted, 0.95);
  const min = d3.min(vals);
  const max = d3.max(vals);
  const lo = currentMetric === "value" ? min : min;
  const hi = currentMetric === "value" ? max : p95;
  return d3.scaleSequential()
    .domain([lo, hi])
    .interpolator(d3.interpolateYlOrRd)
    .clamp(true);
}
let colorScale = makeColorScale();

function buildLegend() {
  document.getElementById("legend-title").textContent = METRIC_INFO[currentMetric].legendTitle;
  const bar = document.getElementById("legend-bar");
  bar.innerHTML = "";
  const N = 12;
  const [lo, hi] = colorScale.domain();
  for (let i = 0; i < N; i++) {
    const t = lo + (hi - lo) * (i / (N - 1));
    const span = document.createElement("span");
    span.style.background = colorScale(t);
    bar.appendChild(span);
  }
  const ticks = document.getElementById("legend-ticks");
  // 데이터는 백만원 단위 → 억원으로 변환 (÷100)
  const fmt = v => currentMetric === "value"
    ? v.toFixed(1) + "%"
    : Math.round(v / 100).toLocaleString();
  ticks.innerHTML = `<span>${fmt(lo)}</span><span>${fmt((lo+hi)/2)}</span><span>${fmt(hi)}+</span>`;
}

/* ═════════════════════════════════════════════════════════════

   ───────────────────────────────────────────────────────────── */
function normProvinceName(raw) {
  if (!raw) return null;
  const s = String(raw).replace(/\s/g, "");
  if (/^서울/.test(s)) return "서울";
  if (/^부산/.test(s)) return "부산";
  if (/^대구/.test(s)) return "대구";
  if (/^인천/.test(s)) return "인천";
  if (/^광주광역|^광주특별/.test(s)) return "광주";
  if (s === "광주") return "광주";
  if (/^대전/.test(s)) return "대전";
  if (/^울산/.test(s)) return "울산";
  if (/^세종/.test(s)) return "세종";
  if (/^경기/.test(s)) return "경기";
  if (/^강원/.test(s)) return "강원";
  if (/^충청북|^충북/.test(s)) return "충북";
  if (/^충청남|^충남/.test(s)) return "충남";
  if (/^전라북|^전북/.test(s)) return "전북";
  if (/^전라남|^전남/.test(s)) return "전남";
  if (/^경상북|^경북/.test(s)) return "경북";
  if (/^경상남|^경남/.test(s)) return "경남";
  if (/^제주/.test(s)) return "제주";
  return null;
}

function normMuniName(raw) {
  if (!raw) return null;
  let n = String(raw).trim();
  n = n.replace(/^(서울특별시|부산광역시|대구광역시|인천광역시|광주광역시|대전광역시|울산광역시|세종특별자치시|경기도|강원도|강원특별자치도|충청북도|충청남도|전라북도|전북특별자치도|전라남도|경상북도|경상남도|제주특별자치도)\s*/, "");
  n = n.trim();
  const tokens = n.split(/\s+/).filter(Boolean);
  if (tokens.length >= 2) {
    n = tokens[tokens.length - 1];
  } else {
    const m = n.match(/^(.+?[시군])([가-힣]+(?:구|시|군))$/);
    if (m) n = m[2];
  }
  return n.trim();
}

      else if (g.type === "MultiPolygon") g.coordinates.forEach(c => allCoords.push(c));
    }
    mergedMunis.push({
      type: "Feature",
      __name: proto.__name, __province: proto.__province,
      properties: { name: proto.__name },
      geometry: { type: "MultiPolygon", coordinates: allCoords }
    });
  }

  for (const pname of ["세종", "제주"]) {
    const pfeat = provByName.get(pname);
    if (!pfeat) continue;
    for (let i = mergedMunis.length - 1; i >= 0; i--) {
      if (mergedMunis[i].__province === pname) mergedMunis.splice(i, 1);
    }
    mergedMunis.push({
      type: "Feature",
      __name: pname, __province: pname, __isFallback: true,
      properties: { name: pname },
      geometry: pfeat.geometry
    });
  }

  // 서울 폴리곤을 마지막에 그려 경기 위에 표시 (offset 후 살짝 겹치는 경우 대비)
  mergedMunis.sort((a, b) => (a.__province === "서울" ? 1 : 0) - (b.__province === "서울" ? 1 : 0));

  muniFeatures = mergedMunis;
  provinceFeatures = provFC.features.map(f => {
    const props = f.properties || {};
    f.__province = normProvinceName(props.name || props.NAME || props.CTP_KOR_NM);
    return f;
  });

  const collection = { type: "FeatureCollection", features: mergedMunis };
  projection = d3.geoMercator().fitExtent([[10,10],[W-10,H-10]], collection);
  geoPath = d3.geoPath(projection);

  document.getElementById("map-loading").style.display = "none";
  svgEl.style.display = "block";

  // Background hatch
  const defs = svg.append("defs");
  const pat = defs.append("pattern")
    .attr("id", "hatch")
    .attr("width", 6).attr("height", 6)
    .attr("patternUnits", "userSpaceOnUse")
    .attr("patternTransform", "rotate(45)");
  pat.append("line")
    .attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", 6)
    .attr("stroke", "rgba(26,20,16,0.04)").attr("stroke-width", 1);
  svg.append("rect")
    .attr("width", W).attr("height", H)
    .attr("fill", "url(#hatch)")
    .style("cursor", "default")
    .on("click", () => {
      if (didZoom) return;
      if (activeZoomProvince || d3.zoomTransform(svgEl).k > 1.05) resetZoom();
    });

  zoomLayer = svg.append("g").attr("class", "zoom-layer");

  // ── PINCH/PAN ZOOM ── d3-zoom for touch (pinch + drag pan + double-tap)
  zoomBehavior = d3.zoom()
    .scaleExtent([1, 40])
    .translateExtent([[-W * 0.5, -H * 0.5], [W * 1.5, H * 1.5]])
    .on("start", () => { didZoom = false; })
    .on("zoom", (event) => {
      if (event.sourceEvent) didZoom = true;
      zoomLayer.attr("transform", event.transform);
      const k = event.transform.k;
      // 광역/시·군·구 라벨은 동일 임계값에서 교차 — 광역이 사라지는 순간 시·군·구가 등장
      const SHOW_MUNI_AT = 2.6;
      zoomLayer.selectAll(".province-label")
        .style("opacity", k > SHOW_MUNI_AT ? 0 : 1);
      if (muniLabelLayer) {
        muniLabelLayer.selectAll(".muni-label").classed("show", k > SHOW_MUNI_AT);
      }
      document.getElementById("reset-zoom").classList.toggle("show", k > 1.05);
    });
  svg.call(zoomBehavior);
  svg.on("dblclick.zoom", null);

  const g = zoomLayer.append("g").attr("class", "regions");
  g.selectAll("path.region")
    .data(mergedMunis)
    .join("path")
      .attr("class", "region")
      .attr("d", geoPath)
      .attr("transform", d => {
        const o = PROV_OFFSET[d.__province];
        return o ? `translate(${o[0]},${o[1]})` : null;
      })
      .attr("data-key", d => featureKey(d))
      .each(function(d) { pathByKey.set(featureKey(d), this); })
      .on("click", function(event, d) {
        event.stopPropagation();
        if (didZoom) return;
        if (!d.__province) return;
        handleRegionTap(d);
      });

  zoomLayer.append("g").attr("class", "province-lines")
    .selectAll("path.province-line")
    .data(provinceFeatures)
    .join("path")
      .attr("class", "province-line")
      .attr("d", geoPath)
      .attr("transform", d => {
        const o = PROV_OFFSET[d.__province];
        return o ? `translate(${o[0]},${o[1]})` : null;
      });

  const labelG = zoomLayer.append("g").attr("class", "province-labels");
  labelG.selectAll("text.province-label")
    .data(provinceFeatures.filter(f => f.__province))
    .join("text")
      .attr("class", "province-label")
      .attr("transform", d => {
        const c = geoPath.centroid(d);
        const o = provOff(d.__province);
        return `translate(${c[0] + o[0]}, ${c[1] + o[1]})`;
      })
      .attr("text-anchor", "middle")
      .attr("dy", "0.35em")
      .text(d => PROV_FULL[d.__province] ? d.__province : "");

  muniLabelLayer = zoomLayer.append("g").attr("class", "muni-labels");

  // 모든 시·군·구 라벨 사전 렌더 (기본 숨김 → 줌 인 시 표시)
  // 폰트 크기는 각 행정구역 폴리곤의 바운딩박스에 맞춰 자동 산출 → 라벨이 영역 안에 들어가도록
  muniLabelLayer.selectAll("text.muni-label")
    .data(muniFeatures.filter(f => !f.__isFallback))
    .join("text")
      .attr("class", "muni-label")
      .attr("transform", d => {
        const c = geoPath.centroid(d);
        const o = provOff(d.__province);
        return `translate(${c[0] + o[0]}, ${c[1] + o[1]})`;
      })
      .attr("text-anchor", "middle")
      .attr("dy", "0.35em")
      .text(d => d.__name || "")
      .each(function(d) {
        const b = geoPath.bounds(d);
        const w = b[1][0] - b[0][0];
        const h = b[1][1] - b[0][1];
        const name = d.__name || "";
        // 서울/경기는 자치구가 좁고 빽빽 → 라벨을 더 작게 잡아 줌 시에도 컴팩트하게
        const isDense = d.__province === "서울" || d.__province === "경기";
        const widthMul  = isDense ? 0.60 : 0.92;
        const heightMul = isDense ? 0.30 : 0.42;
        const cap       = isDense ? 2.5  : 4.0;
        const minSize   = isDense ? 0.5  : 0.6;
        const byWidth  = (w * widthMul) / Math.max(1.5, name.length * 0.95);
        const byHeight = h * heightMul;
        const fs = Math.max(minSize, Math.min(byWidth, byHeight, cap));
        this.style.fontSize   = fs + "px";
        this.style.strokeWidth = (fs * 0.18) + "px";
      });

  applyColors();
}

/* ═════════════════════════════════════════════════════════════
   TAP HANDLING — first tap on a province zooms in;
   in zoomed view, tap on muni opens detail sheet
   ───────────────────────────────────────────────────────────── */
function handleRegionTap(d) {
  hideHint();
  const data = regionDataFor(d);
  if (!data) return;
  const currentK = d3.zoomTransform(svgEl).k;
  const isZoomed = currentK > 1.6;

  // 세종/제주 single-region → 바로 상세 열기 (이미 광역 본청 데이터)
  if (d.__isFallback) {
    setActiveKey(featureKey(d));
    openSheetFor(data);
    return;
  }

  // 전국 화면(광역 라벨이 보이는 상태) → 광역 본청 요약 시트 + 광역 영역으로 확대
  if (!isZoomed) {
    const head = headByProvince.get(d.__province);
    if (head) openSheetFor(head);
    zoomToProvince(d.__province);
    return;
  }

  // 이미 확대된 상태 → 해당 시·군·구 상세
  setActiveKey(featureKey(d));
  openSheetFor(data);
}

function setActiveKey(key) {
  activeKey = key;
  d3.selectAll("#map-svg .region")
    .classed("active", function(d) { return featureKey(d) === key; });
}

/* ═════════════════════════════════════════════════════════════
   ZOOM CONTROL
   ───────────────────────────────────────────────────────────── */
function zoomToProvince(provName) {
  const provFeat = provinceFeatures.find(f => f.__province === provName);
  if (!provFeat) return;
  const [[x0,y0],[x1,y1]] = geoPath.bounds(provFeat);
  const dx = x1 - x0, dy = y1 - y0;
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const k = Math.min(W / dx, H / dy) * 0.9;
  const off = provOff(provName);
  const tx = W / 2 - k * (cx + off[0]);
  const ty = H / 2 - k * (cy + off[1]);

  // d3.zoom 트랜스폼으로 애니메이션 — 라벨/축척 등은 zoom 이벤트가 자동 갱신
  svg.transition().duration(700).call(
    zoomBehavior.transform,
    d3.zoomIdentity.translate(tx, ty).scale(k)
  );

  activeZoomProvince = provName;
  document.getElementById("reset-zoom").classList.add("show");
  hideHint();
}

function resetZoom() {
  if (!zoomBehavior) return;
  svg.transition().duration(550).call(
    zoomBehavior.transform,
    d3.zoomIdentity
  );
  d3.selectAll("#map-svg .region").classed("active", false);
  activeZoomProvince = null;
  activeKey = null;
  document.getElementById("reset-zoom").classList.remove("show");
}

document.getElementById("reset-zoom").addEventListener("click", () => {
  resetZoom();
  closeSheet();
});

function applyColors() {
  colorScale = makeColorScale();
  d3.selectAll("#map-svg .region")
    .attr("fill", d => {
      const data = regionDataFor(d);
      const v = getVal(data);
      return v == null ? "#d8cfbe" : colorScale(v);
    });
  buildLegend();
  if (muniLabelLayer) {
    const [lo, hi] = colorScale.domain();
    muniLabelLayer.selectAll(".muni-label")
      .classed("high", function(d) {
        const data = regionDataFor(d);
        const v = getVal(data);
        const t = (v - lo) / (hi - lo);
        return t > 0.65;
      });
  }
}

/* ═════════════════════════════════════════════════════════════
   BOTTOM SHEET — detail panel
   ───────────────────────────────────────────────────────────── */
// 데이터는 백만원 단위. 1억원 = 100백만원. 모두 억원으로 통일.
const fmtEok = v => ({
  val: Math.round(v / 100).toLocaleString(),
  unit: "억원"
});

function metricCellsFor(d) {
  const b = fmtEok(d.budget);
  const i = fmtEok(d.income);
  return `
    <div class="ic-cell">
      <div class="lbl">재정자립도</div>
      <div class="val">${d.value.toFixed(2)}<span class="unit">%</span></div>
    </div>
    <div class="ic-cell">
      <div class="lbl">예산규모</div>
      <div class="val">${b.val}<span class="unit">${b.unit}</span></div>
    </div>
    <div class="ic-cell">
      <div class="lbl">자체수입</div>
      <div class="val">${i.val}<span class="unit">${i.unit}</span></div>
    </div>
  `;
}

function openSheetFor(data) {
  if (!data) return;
  const body = document.getElementById('sheet-body');
  const isHead = data.isHead;
  const provMunis = MUNIS.filter(x => x.province === data.province);
  const head = headByProvince.get(data.province);
  const natAvg = d3.mean(MUNIS.map(x => x.value));
  const provAvg = provMunis.length ? d3.mean(provMunis.map(x => x.value)) : null;

  let extras = "";
  if (!isHead) {
    const sortedNat = MUNIS.slice().sort((a,b) => b.value - a.value);
    const rankNat = sortedNat.findIndex(x => x === data) + 1;
    const sortedProv = provMunis.slice().sort((a,b) => b.value - a.value);
    const rankProv = sortedProv.findIndex(x => x === data) + 1;
    const diffProv = provAvg != null ? data.value - provAvg : null;
    const diffNat  = data.value - natAvg;
    extras = `
      <div class="row"><span>전국 순위 (자립도)</span><strong>${rankNat} / ${MUNIS.length}</strong></div>
      <div class="row"><span>광역 내 순위</span><strong>${rankProv} / ${provMunis.length}</strong></div>
      <div class="row"><span>광역 본청 자립도</span><strong>${head ? head.value.toFixed(2)+'%' : '–'}</strong></div>
      <div class="row ${diffProv > 0 ? 'pos' : 'neg'}"><span>광역 평균 대비</span><strong>${(diffProv >= 0 ? '+' : '') + diffProv.toFixed(2)}%p</strong></div>
      <div class="row ${diffNat  > 0 ? 'pos' : 'neg'}"><span>전국 평균 대비</span><strong>${(diffNat  >= 0 ? '+' : '') + diffNat.toFixed(2)}%p</strong></div>
    `;
  } else {
    const sortedHeads = HEADS.slice().sort((a,b) => b.value - a.value);
    const rankHead = sortedHeads.findIndex(x => x === data) + 1;
    const headAvg = d3.mean(HEADS.map(x => x.value));
    const diffHeadAvg = data.value - headAvg;
    extras = `
      <div class="row"><span>구분</span><strong>광역 본청</strong></div>
      <div class="row"><span>17개 본청 중 순위</span><strong>${rankHead} / ${HEADS.length}</strong></div>
      <div class="row"><span>관할 시·군·구</span><strong>${provMunis.length}개</strong></div>
      <div class="row ${diffHeadAvg > 0 ? 'pos' : 'neg'}"><span>본청 평균 대비</span><strong>${(diffHeadAvg >= 0 ? '+' : '') + diffHeadAvg.toFixed(2)}%p</strong></div>
    `;
  }

  body.innerHTML = `
    <div class="ic-prov">${PROV_FULL[data.province] || ''}</div>
    <div class="ic-name">${isHead ? PROV_FULL[data.province] + ' 본청' : data.muni}</div>
    <div class="ic-metrics">${metricCellsFor(data)}</div>
    <div class="ic-extras">${extras}</div>
  `;

  document.getElementById('sheet').classList.add('show');
  document.getElementById('sheet-backdrop').classList.add('show');
}

function closeSheet() {
  document.getElementById('sheet').classList.remove('show');
  document.getElementById('sheet-backdrop').classList.remove('show');
  d3.selectAll("#map-svg .region").classed("active", false);
  activeKey = null;
}

document.getElementById('sheet-close').addEventListener('click', closeSheet);
document.getElementById('sheet-backdrop').addEventListener('click', closeSheet);

// Swipe-down to dismiss
(function attachSwipeClose() {
  const sheet = document.getElementById('sheet');
  let startY = null;
  let startTransform = 0;
  sheet.addEventListener('touchstart', (e) => {
    if (sheet.scrollTop > 0) return;
    startY = e.touches[0].clientY;
    startTransform = 0;
    sheet.style.transition = 'none';
  }, { passive: true });
  sheet.addEventListener('touchmove', (e) => {
    if (startY == null) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 0) {
      sheet.style.transform = `translateY(${dy}px)`;
    }
  }, { passive: true });
  sheet.addEventListener('touchend', (e) => {
    if (startY == null) return;
    sheet.style.transition = '';
    sheet.style.transform = '';
    const endY = (e.changedTouches[0] || {}).clientY;
    if (endY != null && endY - startY > 100) {
      closeSheet();
    }
    startY = null;
  });
})();

/* hint banner — hide on first interaction */
let hintHidden = false;
function hideHint() {
  if (hintHidden) return;
  hintHidden = true;
  document.getElementById('hint').classList.add('hide');
}
setTimeout(hideHint, 6000);

/* ═════════════════════════════════════════════════════════════
   METRIC TOGGLE
   ───────────────────────────────────────────────────────────── */
document.querySelectorAll("#metric-toggle button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#metric-toggle button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentMetric = btn.dataset.metric;
    applyColors();
  });
});

/* ═════════════════════════════════════════════════════════════
   INITIAL LOAD
   ───────────────────────────────────────────────────────────── */
buildLegend();

const MUNI_SOURCES = [
  { url: "https://raw.githubusercontent.com/southkorea/southkorea-maps/master/kostat/2013/json/skorea_municipalities_topo_simple.json",
    parse: (j) => topojson.feature(j, j.objects.skorea_municipalities_geo_simple || Object.values(j.objects)[0]) },
  { url: "https://raw.githubusercontent.com/southkorea/southkorea-maps/master/kostat/2013/json/skorea_municipalities_geo_simple.json",
    parse: (j) => j }
];

const PROV_SOURCES = [
  { url: "https://raw.githubusercontent.com/southkorea/southkorea-maps/master/kostat/2013/json/skorea_provinces_topo_simple.json",
    parse: (j) => topojson.feature(j, j.objects.skorea_provinces_geo_simple || Object.values(j.objects)[0]) },
  { url: "https://raw.githubusercontent.com/southkorea/southkorea-maps/master/kostat/2013/json/skorea_provinces_geo_simple.json",
    parse: (j) => j }
];

async function fetchFirst(sources) {
  for (const s of sources) {
    try {
      const res = await fetch(s.url);
      if (!res.ok) continue;
      const json = await res.json();
      return s.parse(json);
    } catch (e) {
      console.warn("fetch failed", s.url, e);
    }
  }
  return null;
}

async function loadAll() {
  const [muniFC, provFC] = await Promise.all([
    fetchFirst(MUNI_SOURCES),
    fetchFirst(PROV_SOURCES)
  ]);
  if (!muniFC || !provFC) {
    document.getElementById("map-loading").innerHTML =
      "▸ 지도 데이터를 불러오지 못했습니다.<br/>네트워크 또는 CDN 접근을 확인해 주세요.";
    return;
  }
  renderMap(muniFC, provFC);
}

loadAll();
</script>
